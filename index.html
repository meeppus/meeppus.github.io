<!DOCTYPE html>
      <html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ffb6d9, #ffd6ec, #fff0f7);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 24px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      color: #ff2f7d;
      margin-bottom: 25px;
      line-height: 1.2;
    }

    .main-image {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: cover;
      border-radius: 20px;
      border: 6px solid #ff7eb3;
    }

    h2 {
      margin-top: 25px;
      font-size: clamp(1.5rem, 4vw, 3rem);
      color: #7a0045;
      line-height: 1.3;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .main-image {
        max-height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Happy Birthday!! I love you!!</h1>

    <!-- Replace the image URL below with your own picture -->
    <img
      class="main-image"
      src="bruno.png"
      alt="Concert celebration"
    />

    <h2>WERE GOING TO SEE BRUNO WOOO</h2>
  </div>
</body>
</html>
